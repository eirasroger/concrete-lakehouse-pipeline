[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "concrete-data-pipeline"
version = "0.1.0"
description = "Bronze/silver/gold Delta Lake pipeline for a context-adaptive concrete recommendation dataset"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
authors = [{ name = "Roger Verges Eiras" }]
keywords = ["pyspark", "delta-lake", "lakehouse", "data-quality", "concrete", "lca"]

# Deliberately empty. Spark and Delta are *provided by the runtime* -- the
# Databricks serverless environment already has both, and declaring them here
# would make `bundle deploy` pip-install a second PySpark over the platform's
# own. Local development gets them from requirements.txt or the `local` extra.
dependencies = []

[project.optional-dependencies]
local = ["pyspark>=3.5", "delta-spark>=3.2"]
dev = ["pyspark>=3.5", "delta-spark>=3.2", "pytest>=8.0", "build>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
# Spark-backed tests each cost seconds (a JVM job per assertion, and MERGE is
# several). Marking them lets the pure-Python logic be checked in about a second:
#   pytest -m "not spark"     fast feedback
#   pytest                    everything
markers = [
    "spark: needs a live Spark session (slow)",
]
filterwarnings = [
    # PySpark 4 on Python 3.12+ is noisy about these and they are not ours.
    "ignore::DeprecationWarning",
    "ignore::ResourceWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
