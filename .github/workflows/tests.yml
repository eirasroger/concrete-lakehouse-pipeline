name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      # PySpark needs a JVM. Java 17 covers both delta-spark 3.x and 4.x.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The Maven coordinates delta-spark resolves at session startup are the
      # slowest part of a cold run; keep them between builds.
      - name: Cache Ivy jars
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2
            ~/.m2/repository
          key: ivy-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: ivy-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The suite runs against tests/fixtures only; the raw CORA.RDR files are
      # not in the repo and are not needed here.
      - name: Run tests
        run: pytest -q

      - name: Check the exploration script runs without the raw files
        run: |
          python scripts/explore_raw.py --raw-dir tests/fixtures
