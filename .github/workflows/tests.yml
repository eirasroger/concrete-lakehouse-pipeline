name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      # PySpark needs a JVM. Java 17 covers both delta-spark 3.x and 4.x.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # No Ivy cache, deliberately.
      #
      # Delta's jars are resolved by `configure_spark_with_delta_pip` at session
      # startup, and caching ~/.ivy2 makes that resolution non-deterministic: a
      # partial or stale cache restored under `restore-keys` leaves Ivy
      # believing it already has what it needs, and the run dies with
      # "NoClassDefFoundError: io/delta/storage/LogStore" -- delta-spark present,
      # delta-storage missing. Re-resolving costs about a minute per job and is
      # worth it for a build that means something.

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Fast first: the Spark-free tests take about a second, so a broken
      # classifier or config fails the build before the JVM has even started.
      - name: Run fast tests
        run: pytest -m "not spark" -q

      # Show what the runner actually has, so a heap that fails to reserve is
      # obvious in the log rather than a silent early exit.
      - name: Report runner resources
        run: |
          free -h || true
          nproc || true
          java -version

      # The suite runs against tests/fixtures only; the raw CORA.RDR files are
      # not in the repo and are not needed here. `-ra` prints a reason for every
      # non-passing test, which is what makes a CI failure diagnosable at all.
      - name: Run full suite
        run: pytest -q -ra --tb=short
        env:
          CONCRETE_TEST_DRIVER_MEMORY: 2g

      - name: Check the exploration script runs without the raw files
        run: |
          python scripts/explore_raw.py --raw-dir tests/fixtures

      # The bundle's structure is asserted in tests/test_bundle.py, which runs
      # above. This only proves the wheel the bundle deploys actually builds.
      - name: Build the wheel the bundle deploys
        run: python -m build --wheel
